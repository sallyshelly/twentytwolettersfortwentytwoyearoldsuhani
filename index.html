<script>
/* ==================================================================
   📸  THE PHOTOS OF THE NOTES  (one image per page)
   ------------------------------------------------------------------
   Just put your image files in the SAME folder as this index.html.
   The page reads whatever images are there — no list to maintain.

   ➕  TO ADD A PHOTO: drop the image file next to index.html
       (in your GitHub repo, upload it into the repo's main folder).
       Photos show up in filename order (2 before 10).

   HOW IT FINDS THEM:
     • On GitHub Pages it asks the GitHub API to list the repo files.
     • Locally, serve the folder (`python3 -m http.server`) and it
       reads the directory listing. (Double-clicking the file can't
       read a folder, so then it uses the FALLBACK list below.)
   ================================================================== */

// If the folder can't be read (e.g. the file was double-clicked
// instead of served), fall back to this known list so it still works.
const FALLBACK = [
  "22 years of suhani!!! When I think of you 1 simultaneously.jpeg",
  "IMG_0001.jpeg", "IMG_0002.jpeg", "IMG_0003.jpeg",
  "IMG_0004.jpeg", "IMG_0005.jpeg", "pavan.png",
];

let photos = [];   // filled in at startup from the live pics/ listing

const IMG_RE = /\.(jpe?g|png|gif|webp|avif|heic|heif|bmp|tiff?)$/i;
const natSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

// If we're on GitHub Pages, work out owner/repo from the URL so we can ask
// the GitHub API what's in the repo folder.
function githubRepoInfo(){
  const host = location.hostname;                 // e.g. "suhani.github.io"
  if (!host.endsWith('.github.io')) return null;
  const owner = host.slice(0, -('.github.io'.length));
  const seg = location.pathname.split('/').filter(Boolean);
  const repo = seg.length ? seg[0] : `${owner}.github.io`;   // project vs. user site
  return { owner, repo };
}

// Figure out which images sit next to index.html — reading the actual folder,
// no manifest to maintain.
async function loadPhotos(){
  // A) GitHub Pages: ask the GitHub API to list the repo's files.
  const gh = githubRepoInfo();
  if (gh) {
    try {
      const res = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents`,
                              { headers: { Accept: 'application/vnd.github+json' } });
      if (res.ok) {
        const items = await res.json();
        if (Array.isArray(items)) {
          const names = items.filter(x => x.type === 'file' && IMG_RE.test(x.name))
                             .map(x => x.name).sort(natSort);
          if (names.length) return names;
        }
      }
    } catch {}
  }

  // B) Local server that returns a directory listing (e.g. `python3 -m http.server`).
  try {
    const res = await fetch('./', { cache: 'no-store' });
    if (res.ok) {
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      const names = [...doc.querySelectorAll('a[href]')]
        .map(a => a.getAttribute('href') || '')
        .map(h => decodeURIComponent(h.split('/').pop().split('?')[0]))   // filename only
        .filter(n => IMG_RE.test(n));
      const uniq = [...new Set(names)].sort(natSort);
      if (uniq.length) return uniq;
    }
  } catch {}

  return null;   // nothing worked (e.g. opened via file://) → FALLBACK list is used
}

/* ==================================================================
   ✍️  TYPED LETTERS  (for notes that are text, not a photo)
   ------------------------------------------------------------------
   Key each letter by its PAGE NUMBER (1–22). Photos automatically
   fill every OTHER page, flowing around these pinned pages.
   Put the whole message (including any sign-off) in "text".
   ================================================================== */
const textLetters = {
  8: {
    from: "",   // leave blank — the sign-off is already inside the text
    text:
`Dear Suhani,

Happy 22!! I hope you're out getting drunk, singing and taking lots of pictures. I miss u loads, but I'm so excited for the next year! Starting a job and moving cities is crazy but I know ur going to enjoy it so much. Can't wait to celebrate with u soon!!

Lots of love,
Jhallak`
  },
};

/* ================================================================== */


// ----------------- the machinery (no need to edit) -----------------
const FLIP_MS = 820;
const TARGET_PAGES = 22;          // always fill the book to 22 pages
let total = 0;
let current = 0;
let busy = false;

const book     = document.getElementById('book');
const cover    = document.getElementById('cover');
const front    = document.getElementById('pageFront');
const back     = document.getElementById('pageBack');
const frontIn  = front.querySelector('.page-inner');
const backIn   = back.querySelector('.page-inner');
const controls = document.getElementById('controls');
const counter  = document.getElementById('counter');
const prevBtn  = document.getElementById('prevBtn');
const nextBtn  = document.getElementById('nextBtn');
const openHint = document.getElementById('openHint');
const homeBtn  = document.getElementById('homeBtn');
const pageInput    = document.getElementById('pageInput');
const counterTotal = document.getElementById('counterTotal');
const lightbox      = document.getElementById('lightbox');
const lightboxImg   = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

const pad = n => String(n + 1).padStart(2, '0');

// build a safe src for a filename that may contain spaces / punctuation.
// images live in the SAME folder as this index.html.
const photoSrc = name => encodeURIComponent(name);

// keep every photo warm in the browser cache so re-rendering a page paints
// instantly (no reload "blink"). The kept references stop them being dropped.
const _preloaded = [];
function preloadPhotos(){
  photos.forEach(name => { const im = new Image(); im.decoding = 'sync'; im.src = photoSrc(name); _preloaded.push(im); });
}

// escape user text before putting it into innerHTML
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Combine the typed letters + the folder photos into one ordered list of pages.
// Typed letters stay pinned to their page number; photos flow around them.
let pages = [];
function buildPages(){
  pages = [];
  const queue = [...photos];              // photos fill every non-letter slot, in order
  for (let n = 1; n <= total; n++){
    if (textLetters[n]) {
      pages.push({ type: 'text', text: textLetters[n].text, from: textLetters[n].from || '' });
    } else if (queue.length) {
      pages.push({ type: 'photo', name: queue.shift() });
    } else {
      pages.push({ type: 'placeholder' });
    }
  }
}

function pageHTML(i){
  const page = pages[i] || { type: 'placeholder' };
  const head = `<div class="page-no">no. ${pad(i)}</div>`;

  if (page.type === 'text') {
    const from = page.from && page.from.trim()
      ? `<div class="msg-from">— ${esc(page.from)}</div>` : '';
    return `${head}
      <div class="msg">${esc(page.text)}${from}</div>`;
  }
  if (page.type === 'photo') {
    return `${head}
      <div class="photo-slot">
        <img class="page-photo" src="${photoSrc(page.name)}" alt="note ${pad(i)}" decoding="sync">
      </div>`;
  }
  // placeholder
  return `${head}
    <div class="coming-soon">coming suhn, suhano <span class="sub-heart">♡</span></div>`;
}

function updateControls(idx = current){
  // don't clobber what the user is currently typing in the page box
  if (document.activeElement !== pageInput) pageInput.value = pad(idx);
  counterTotal.textContent = `/ ${total}`;
  // on the first letter the back arrow returns to the cover, so it stays enabled
  prevBtn.disabled = false;
  prevBtn.setAttribute('aria-label', idx === 0 ? 'Back to cover' : 'Previous letter');
  nextBtn.disabled = idx === total - 1;
}

// jump straight to a page number (1-based), like an e-book's "go to page"
function goToPage(n){
  if (busy || !book.classList.contains('opened')) return;
  if (!Number.isFinite(n)) return;
  current = Math.min(Math.max(1, Math.round(n)), total) - 1;   // clamp into range
  render();
}

function render(){
  frontIn.innerHTML = pageHTML(current);
  backIn.innerHTML  = pageHTML(current + 1 < total ? current + 1 : current);
  updateControls();
}

function openBook(){
  book.classList.add('opened');
  cover.classList.add('open');
  cover.setAttribute('aria-hidden', 'true');
  cover.tabIndex = -1;
  openHint.classList.add('hide');
  setTimeout(() => {
    controls.classList.add('show');
    homeBtn.classList.add('show');
  }, 500);
}

function closeBook(){
  if (busy) return;
  homeBtn.classList.remove('show');
  controls.classList.remove('show');     // arrows + counter fade out first
  cover.classList.remove('open');        // cover flips back over the pages (~1.15s)
  cover.removeAttribute('aria-hidden');
  cover.tabIndex = 0;
  // NOTE: we deliberately do NOT reset to page 1 yet — the current page stays
  // visible under the cover as it swings shut, so there's no jump to page 1.
  const stillClosing = () => !cover.classList.contains('open');   // guard against a quick re-open
  // "tap to open" sits below the book (no page overlap), so it can return
  // as soon as the controls have faded
  setTimeout(() => { if (stillClosing()) openHint.classList.remove('hide'); }, 450);
  // the ribbon lives on the cover — only bring it back once the cover has
  // finished closing, so it never flashes over the pages
  setTimeout(() => { if (stillClosing()) book.classList.remove('opened'); }, 650);
  // reset to page 1 only after the cover has fully closed over the pages
  setTimeout(() => { if (stillClosing()) { current = 0; render(); } }, 1200);
}

function goNext(){
  if (busy || current >= total - 1) return;
  busy = true;
  updateControls(current + 1);                     // counter reacts instantly, before the flip
  backIn.innerHTML = pageHTML(current + 1);        // reveal next underneath
  book.classList.add('flipping');
  front.style.transition = `transform ${FLIP_MS}ms cubic-bezier(.62,.02,.2,1)`;
  front.style.transform  = 'rotateY(-180deg)';
  setTimeout(() => {
    current++;
    front.style.transition = 'none';
    front.style.transform  = 'rotateY(0deg)';
    book.classList.remove('flipping');
    front.offsetHeight;                             // force reflow
    render();
    busy = false;
  }, FLIP_MS);
}

function goPrev(){
  if (busy) return;
  if (current <= 0) { closeBook(); return; }   // back on page 1 → return to the cover
  busy = true;
  updateControls(current - 1);                      // counter reacts instantly, before the flip
  backIn.innerHTML  = pageHTML(current);            // current stays beneath
  frontIn.innerHTML = pageHTML(current - 1);        // previous flips in
  front.style.transition = 'none';
  front.style.transform  = 'rotateY(-180deg)';
  front.offsetHeight;                               // force reflow
  book.classList.add('flipping');
  requestAnimationFrame(() => {
    front.style.transition = `transform ${FLIP_MS}ms cubic-bezier(.62,.02,.2,1)`;
    front.style.transform  = 'rotateY(0deg)';
  });
  setTimeout(() => {
    current--;
    book.classList.remove('flipping');
    render();
    busy = false;
  }, FLIP_MS);
}

// ----- the enlarged-photo pop-up -----
function openLightbox(i){
  const page = pages[i];
  if (!page || page.type !== 'photo') return;
  lightboxImg.src = photoSrc(page.name);
  lightboxImg.alt = 'note ' + pad(i);
  lightbox.classList.add('show');
  lightbox.setAttribute('aria-hidden', 'false');
}
function closeLightbox(){
  lightbox.classList.remove('show');
  lightbox.setAttribute('aria-hidden', 'true');
}
const lightboxOpen = () => lightbox.classList.contains('show');

// events
cover.addEventListener('click', openBook);
cover.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
});
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
homeBtn.addEventListener('click', closeBook);

// editable page number — type a page and jump straight to it
function commitPageInput(){
  const n = parseInt(pageInput.value, 10);
  if (!isNaN(n)) goToPage(n);
  pageInput.value = pad(current);        // normalize (e.g. "5" → "05", clamp out-of-range)
}
pageInput.addEventListener('focus', () => pageInput.select());
pageInput.addEventListener('input', () => { pageInput.value = pageInput.value.replace(/\D/g, '').slice(0, 2); });
pageInput.addEventListener('keydown', e => {
  e.stopPropagation();                   // don't let page-flip arrows fire while typing
  if (e.key === 'Enter')  { e.preventDefault(); commitPageInput(); pageInput.blur(); }
  else if (e.key === 'Escape') { e.preventDefault(); pageInput.value = pad(current); pageInput.blur(); }
});
pageInput.addEventListener('blur', commitPageInput);

// clicking the photo opens the larger view
front.addEventListener('click', e => {
  if (busy || !book.classList.contains('opened')) return;
  if (e.target.closest('.page-photo')) openLightbox(current);
});
lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', e => {
  if (document.activeElement === pageInput) return;   // typing a page number
  if (lightboxOpen()) {                       // pop-up takes priority
    if (e.key === 'Escape') closeLightbox();
    return;
  }
  if (cover.classList.contains('open')) {
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft')  goPrev();
  }
});

// load the folder, then draw the first page
(async function init(){
  photos = (await loadPhotos()) || FALLBACK;
  // make sure every photo and every typed letter has a page
  total  = Math.max(TARGET_PAGES, photos.length + Object.keys(textLetters).length);
  preloadPhotos();
  buildPages();
  current = 0;
  render();
})();
</script>
</body>
</html>
